services:
  # ========================================================
  # PostgreSQL 16 with pgvector extension enabled
  # ========================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: collabflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collabflow}
      POSTGRES_USER: ${POSTGRES_USER:-collabflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CollabFlowSecureDb2026!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collabflow_admin} -d ${POSTGRES_DB:-collabflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================
  # Redis 7.2 (Channels layer, Celery broker & Presence)
  # ========================================================
  redis:
    image: redis:7.2-alpine
    container_name: collabflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================
  # Django ASGI Application Server (Daphne)
  # ========================================================
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collabflow-web
    restart: unless-stopped
    command: >
      bash -c "python manage.py migrate --noinput &&
               python manage.py seed_demo &&
               python manage.py collectstatic --noinput &&
               daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SECRET_KEY=${SECRET_KEY:-collabflow-super-secret-key-production-grade-2026}
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgresql://${POSTGRES_USER:-collabflow_admin}:${POSTGRES_PASSWORD:-CollabFlowSecureDb2026!}@postgres:5432/${POSTGRES_DB:-collabflow}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:80
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ========================================================
  # Celery Background Task Worker
  # ========================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collabflow-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "-c", "4"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SECRET_KEY=${SECRET_KEY:-collabflow-super-secret-key-production-grade-2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-collabflow_admin}:${POSTGRES_PASSWORD:-CollabFlowSecureDb2026!}@postgres:5432/${POSTGRES_DB:-collabflow}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ========================================================
  # Celery Beat Scheduler (Periodic Tasks & Reminders)
  # ========================================================
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collabflow-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SECRET_KEY=${SECRET_KEY:-collabflow-super-secret-key-production-grade-2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-collabflow_admin}:${POSTGRES_PASSWORD:-CollabFlowSecureDb2026!}@postgres:5432/${POSTGRES_DB:-collabflow}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ========================================================
  # Nginx Gateway (HTTP + WebSockets /ws/ reverse proxy)
  # ========================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: collabflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
