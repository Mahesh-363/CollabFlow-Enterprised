[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "collabflow-backend"
version = "1.0.0"
description = "Production-grade backend for CollabFlow Real-Time Enterprise Collaboration"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "migrations",
    ".venv",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008", "W191"]

[tool.ruff.lint.per-file-ignores]
"config/asgi.py" = ["E402"]
"config/settings/*.py" = ["F403", "F405"]

[tool.black]
line-length = 100
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | migrations
)/
'''

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "migrations",
    "\\.venv",
]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--ds=config.settings.dev -p no:warnings"
python_files = ["tests.py", "test_*.py", "*_test.py"]
pythonpath = ["."]
asyncio_mode = "auto"
