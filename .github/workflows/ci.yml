name: CollabFlow Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: collabflow_test
          POSTGRES_USER: collabflow_admin
          POSTGRES_PASSWORD: TestPassword2026!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint, Format & Type-Check (Ruff, Black & Mypy)
        working-directory: ./backend
        run: |
          ruff check .
          black --check .
          mypy .

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DATABASE_URL: postgresql://collabflow_admin:TestPassword2026!@localhost:5432/collabflow_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-collabflow-2026
        run: |
          pytest

  frontend-build-and-test:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Native Unit Tests (38 tests)
        run: node --test src/utils/*.test.ts

      - name: Build Frontend Application
        run: npm run build
